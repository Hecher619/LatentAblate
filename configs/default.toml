model_path = "Qwen/Qwen2.5-1.5B-Instruct"
output_dir = "./out/liberated_model"
device = "auto"
torch_dtype = "float16"

[surgery]
target_layers = [15, 19, 23]
layer_window = 2
basis_rank_attn = 20
basis_rank_mlp = 14
alpha_attn = 1.05
alpha_mlp = 0.75
target_components = ["attn", "mlp"]
preserve_capability = true

[datasets]
profile = "safety_uncensored"
