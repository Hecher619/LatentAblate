model_path = "Qwen/Qwen2.5-1.5B-Instruct"
output_dir = "./out/liberated_model"
device = "auto"
torch_dtype = "float16"

[surgery]
target_layers = [18]
layer_window = 2
basis_rank_attn = 16
basis_rank_mlp = 12
alpha_attn = 1.0
alpha_mlp = 1.0
target_components = ["attn", "mlp"]
preserve_capability = true

[datasets]
profile = "safety_uncensored"
