[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-ablate"
version = "0.2.0"
description = "Local CLI and research toolkit for latent representation analysis, VELORA steering, and directional weight modification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "optuna>=3.5.0",
    "tqdm",
    "rich",
]

[project.scripts]
latent-ablate = "latent_ablate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["latent_ablate*"]
