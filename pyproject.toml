[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-ablate"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.40", "pyyaml", "tqdm", "huggingface_hub"]

[project.optional-dependencies]
optuna = ["optuna"]

[project.scripts]
latent-ablate = "latent_ablate.cli:main"
